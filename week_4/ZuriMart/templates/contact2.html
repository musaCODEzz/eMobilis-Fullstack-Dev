{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <!-- Link to external contact2.css -->
    <link rel="stylesheet" href="{% static 'css/contact2.css' %}">
</head>
<body>

    <div class="form-container">
        <h1>Contact Form</h1>
        <p class="subtitle">Please enter your details:</p>

        <form action="#" method="POST" class="contact-box">
            {% csrf_token %}

            <p class="note">Required fields are marked with an asterisk.</p>

            <div class="field-row">
                <label for="first_name">*First name:</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>

            <div class="field-row">
                <label for="last_name">*Last name:</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>

            <div class="field-row">
                <label for="email">*Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="field-row">
                <label for="tel">Tel:</label>
                <input type="tel" id="tel" name="tel">
            </div>

            <div class="field-row">
                <label for="fax">Fax:</label>
                <input type="text" id="fax" name="fax">
            </div>

            <div class="field-row">
                <label for="mob">Mob:</label>
                <input type="tel" id="mob" name="mob">
            </div>

            <div class="field-row">
                <label for="dob">*Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <!-- Gender Fieldset -->
            <fieldset class="gender-box">
                <legend>Gender*</legend>
                <div class="radio-option">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="non_binary" name="gender" value="non_binary">
                    <label for="non_binary">Non-binary</label>
                </div>
            </fieldset>

            <!-- Comments Textarea -->
            <div class="comment-group">
                <label for="comment">Leave a comment:</label>
                <textarea id="comment" name="comment" rows="4"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="submit-row">
                <button type="submit">Submit</button>
            </div>
        </form>

        <p class="back-link">
            <a href="{% url 'home' %}">← Back to Home</a>
        </p>
    </div>

</body>
</html>
