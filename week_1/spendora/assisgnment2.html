<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="/week_1//spendora/css/assignment.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel -->
        <div class="left-panel">
            <h2>Come join us!</h2>
            <p>We are so excited to have you here. If you haven't already, create an account to get access to exclusive offers, rewards, and discounts.</p>
            <button class="signin-btn">Already have an account? Signin.</button>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <h2>Signup</h2>
            <form action="#">
                <input type="text" placeholder="ByteWebster" required>
                <input type="email" placeholder="support@bytewebster.com" required>
                <input type="password" placeholder="........" required>
                <input type="password" placeholder="........" required>
                <button type="submit" class="signup-btn">Signup</button>
            </form>
            
            <div class="social-signup">
                <p>or signup with</p>
                <div class="social-icons">
                    <a href="#" class="icon facebook"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="icon google"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="icon linkedin"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
