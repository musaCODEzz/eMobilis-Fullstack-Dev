<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendora Contact</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <h1 class="fw-bold text-primary mb-2">Spendora</h1>
                        <p class="text-muted">We'd love to hear from you. Drop us a line!</p>
                    </div>

                    <form>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control bg-light" id="name" placeholder="John Doe" required>
                            <label for="name">Full Name</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control bg-light" id="email" placeholder="name@example.com" required>
                            <label for="email">Email address</label>
                        </div>
                        <div class="form-floating mb-4">
                            <textarea class="form-control bg-light" id="message" placeholder="Leave a comment here" style="height: 130px" required></textarea>
                            <label for="message">Your Message</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm">
                            Send Message
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
